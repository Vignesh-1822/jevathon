name: selftest

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Client selftest
        run: node jev.mjs selftest
      - name: Judge selftest
        run: node jev-goal.mjs selftest
